<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Learning Progress – Madjid Vision</title>
  
</head>
<body>
  <div data-component="navbar"></div>
  <div class="dashboard-container">
    <div class="dashboard-card">
      <h3>Learning Progress</h3>
      <p class="info" id="progressText">5 of 10 courses completed</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
  <div data-component="footer"></div>
  <script>
    // Simulate course data
    const completed = 5;
    const total = 10;
    const percent = Math.round((completed / total) * 100);

    // Update UI
    document.getElementById('progressText').textContent = `${completed} of ${total} courses completed`;
    document.getElementById('progressFill').style.width = percent + '%';
  </script>
  <script src="layout.js" defer></script>
  <script src="scripts.js" defer></script>
</body>
</html>
